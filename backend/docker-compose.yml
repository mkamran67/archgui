services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archgui
      POSTGRES_USER: archgui
      POSTGRES_PASSWORD: archgui
    ports:
      - "5432:5432"
    volumes:
      - archgui_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archgui -d archgui"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archgui_postgres:
